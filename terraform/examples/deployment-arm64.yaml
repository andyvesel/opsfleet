apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-arm64
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-arm64
  template:
    metadata:
      labels:
        app: app-arm64
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: app
          image: nginx:alpine
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
